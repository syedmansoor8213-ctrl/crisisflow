<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrisisFlow — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --surface: #0f0f0f;
    --surface2: #161616;
    --border: #1e1e1e;
    --border2: #2a2a2a;
    --text: #f0f0f0;
    --muted: #555;
    --dim: #333;
    --red: #ff3b2f;
    --red-dim: rgba(255,59,47,0.08);
    --green: #30d158;
    --green-dim: rgba(48,209,88,0.08);
    --gray-dim: rgba(100,100,100,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8,8,8,0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--red); }

  .header-divider {
    width: 1px;
    height: 18px;
    background: var(--border2);
  }

  .biz-name {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-csv {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-csv:hover {
    border-color: var(--red);
    color: var(--red);
  }

  .btn-logout {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-family: 'Syne', sans-serif;
    padding: 8px 12px;
    border-radius: 8px;
    transition: color 0.2s;
  }

  .btn-logout:hover { color: var(--text); }

  /* ── REFRESH INDICATOR ── */
  .refresh-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 3s infinite;
    flex-shrink: 0;
  }

  /* ── CONTROLS ── */
  .controls {
    padding: 16px 28px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border2);
    padding: 4px;
    border-radius: 10px;
  }

  .tab {
    padding: 7px 16px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border2);
  }

  .tab.tab-urgent.active {
    background: var(--red-dim);
    color: var(--red);
    border-color: rgba(255,59,47,0.2);
  }

  .tab-count {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    background: var(--border2);
    padding: 1px 6px;
    border-radius: 10px;
    color: var(--muted);
  }

  .tab.tab-urgent.active .tab-count {
    background: rgba(255,59,47,0.15);
    color: var(--red);
  }

  .filter-group {
    display: flex;
    gap: 4px;
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border2);
    padding: 4px;
    border-radius: 10px;
  }

  .filter {
    padding: 6px 12px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter:hover { color: var(--text); }

  .filter.active {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border2);
  }

  /* ── LEADS CONTAINER ── */
  .leads {
    padding: 20px 28px 60px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ── LEAD CARD ── */
  .lead-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: all 0.15s;
    animation: fadeUp 0.3s ease forwards;
    opacity: 0;
    cursor: default;
  }

  .lead-card:hover {
    background: var(--surface2);
    border-color: var(--border2);
    transform: translateX(2px);
  }

  .lead-card.urgent {
    border-color: rgba(255,59,47,0.3);
    background: rgba(255,59,47,0.04);
  }

  .lead-card.urgent:hover {
    border-color: rgba(255,59,47,0.5);
    background: rgba(255,59,47,0.06);
  }

  /* ── CARD TOP ── */
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 12px;
  }

  .card-top-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    color: var(--muted);
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .lead-card.urgent .avatar {
    background: var(--red-dim);
    border-color: rgba(255,59,47,0.2);
    color: var(--red);
  }

  .caller-info { min-width: 0; }

  .caller-name {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .caller-time {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .card-top-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex-shrink: 0;
  }

  /* ── BADGE ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .badge::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .badge.urgent {
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(255,59,47,0.2);
  }

  .badge.urgent::before {
    background: var(--red);
    box-shadow: 0 0 4px var(--red);
    animation: pulse 1.5s infinite;
  }

  .badge.qualified {
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(48,209,88,0.2);
  }

  .badge.qualified::before { background: var(--green); }

  .badge.junk {
    background: var(--gray-dim);
    color: var(--muted);
    border: 1px solid var(--border2);
  }

  .badge.junk::before { background: var(--muted); }

  .source-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 1px;
  }

  /* ── CARD META ── */
  .card-meta {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 14px;
  }

  .meta-item {}

  .meta-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 3px;
  }

  .meta-value {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }

  .meta-value a {
    color: var(--text);
    text-decoration: none;
  }

  .meta-value a:hover { color: var(--red); }

  /* ── SUMMARY ── */
  .summary {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
    font-weight: 400;
  }

  .lead-card.urgent .summary {
    border-color: rgba(255,59,47,0.1);
    background: rgba(255,59,47,0.03);
  }

  /* ── EMPTY ── */
  .empty {
    text-align: center;
    padding: 80px 24px;
    color: var(--muted);
  }

  .empty-icon { font-size: 36px; margin-bottom: 16px; opacity: 0.4; }
  .empty h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; font-weight: 700; }
  .empty p { font-size: 14px; }

  /* ── LOADING ── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 60px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
  }

  .loading-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
  }

  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    z-index: 999;
    transform: translateY(60px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }

  .toast.show { transform: translateY(0); opacity: 1; }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,59,47,0.4); }
    70% { box-shadow: 0 0 0 6px rgba(255,59,47,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,59,47,0); }
  }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .header { padding: 0 16px; }
    .controls { padding: 12px 16px; }
    .leads { padding: 16px 16px 60px; }
    .filter-group { margin-left: 0; }
    .biz-name { display: none; }
    .header-divider { display: none; }
  }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="logo">Crisis<span>Flow</span></div>
    <div class="header-divider"></div>
    <div class="biz-name" id="biz-name">Loading...</div>
  </div>
  <div class="header-right">
    <div class="refresh-dot" title="Auto-refreshes every 60s"></div>
    <button class="btn-csv" onclick="downloadCSV()">
      ↓ Export
    </button>
    <button class="btn-logout" onclick="logout()">Sign out</button>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="tabs">
    <button class="tab active" onclick="setTab('all', this)">
      All <span class="tab-count" id="count-all">0</span>
    </button>
    <button class="tab tab-urgent" onclick="setTab('urgent', this)">
      🔴 Urgent <span class="tab-count" id="count-urgent">0</span>
    </button>
    <button class="tab" onclick="setTab('qualified', this)">
      Qualified <span class="tab-count" id="count-qualified">0</span>
    </button>
    <button class="tab" onclick="setTab('junk', this)">
      Junk <span class="tab-count" id="count-junk">0</span>
    </button>
  </div>
  <div class="filter-group">
    <button class="filter active" onclick="setFilter('today', this)">Today</button>
    <button class="filter" onclick="setFilter('yesterday', this)">Yesterday</button>
    <button class="filter" onclick="setFilter('3days', this)">3 Days</button>
    <button class="filter" onclick="setFilter('7days', this)">7 Days</button>
    <button class="filter" onclick="setFilter('all', this)">All</button>
  </div>
</div>

<!-- LEADS -->
<div class="leads" id="leads-container">
  <div class="loading">
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
  </div>
</div>

<script>
  const tid = localStorage.getItem('rr_tenant_id');
  const sk  = localStorage.getItem('rr_secret_key');
  const biz = localStorage.getItem('rr_business_name');

  if (!tid || !sk) window.location.href = '/index.html';

  document.getElementById('biz-name').textContent = biz || '';

  let currentTab    = 'all';
  let currentFilter = 'today';
  let allLeads      = [];

  // ── TABS & FILTERS ──
  function setTab(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderLeads(filterLeads());
  }

  function setFilter(filter, el) {
    currentFilter = filter;
    document.querySelectorAll('.filter').forEach(f => f.classList.remove('active'));
    el.classList.add('active');
    loadLeads();
  }

  // ── LOAD ──
  async function loadLeads() {
    showLoading();
    try {
      const params = new URLSearchParams({
        tenant_id: tid,
        secret_key: sk,
        filter: currentFilter,
        tab: 'all' // always fetch all, filter client-side for counts
      });

      const res = await fetch(`/api/get-leads?${params}`);
      if (res.status === 401 || res.status === 403) { logout(); return; }

      const data = await res.json();
      allLeads = data.leads || [];
      updateCounts();
      renderLeads(filterLeads());
    } catch {
      document.getElementById('leads-container').innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚡</div>
          <h3>Connection failed</h3>
          <p>Check your connection and try again</p>
        </div>`;
    }
  }

  // ── FILTER ──
  function filterLeads() {
    if (currentTab === 'all') return allLeads;
    return allLeads.filter(l => l.urgency_class === currentTab);
  }

  // ── COUNTS ──
  function updateCounts() {
    document.getElementById('count-all').textContent      = allLeads.length;
    document.getElementById('count-urgent').textContent   = allLeads.filter(l => l.urgency_class === 'urgent').length;
    document.getElementById('count-qualified').textContent = allLeads.filter(l => l.urgency_class === 'qualified').length;
    document.getElementById('count-junk').textContent     = allLeads.filter(l => l.urgency_class === 'junk').length;
  }

  // ── RENDER ──
  function renderLeads(leads) {
    const container = document.getElementById('leads-container');

    if (!leads.length) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📭</div>
          <h3>No leads yet</h3>
          <p>Leads will appear here after calls or form submissions</p>
        </div>`;
      return;
    }

    // Urgent always first
    const sorted = [...leads].sort((a, b) => {
      if (a.urgency_class === 'urgent' && b.urgency_class !== 'urgent') return -1;
      if (b.urgency_class === 'urgent' && a.urgency_class !== 'urgent') return 1;
      return new Date(b.created_at) - new Date(a.created_at);
    });

    container.innerHTML = sorted.map((lead, i) => {
      const name    = lead.caller_name || 'Unknown Caller';
      const initial = name.charAt(0).toUpperCase();
      const phone   = lead.callback_phone || lead.caller_phone || '—';
      const source  = lead.source === 'call' ? '📞 call' : '📋 form';

      return `
        <div class="lead-card ${lead.urgency_class}" style="animation-delay:${i * 40}ms">
          <div class="card-top">
            <div class="card-top-left">
              <div class="avatar">${initial}</div>
              <div class="caller-info">
                <div class="caller-name">${esc(name)}</div>
                <div class="caller-time">${formatTime(lead.created_at)}</div>
              </div>
            </div>
            <div class="card-top-right">
              <span class="badge ${lead.urgency_class}">${lead.urgency_class}</span>
              <span class="source-badge">${source}</span>
            </div>
          </div>

          <div class="card-meta">
            <div class="meta-item">
              <span class="meta-label">Phone</span>
              <span class="meta-value">
                <a href="tel:${esc(phone)}">${esc(phone)}</a>
              </span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Job Type</span>
              <span class="meta-value">${esc(lead.job_type || '—')}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Location</span>
              <span class="meta-value">${esc(lead.location || '—')}</span>
            </div>
          </div>

          ${lead.ai_summary ? `<div class="summary">${esc(lead.ai_summary)}</div>` : ''}
        </div>`;
    }).join('');
  }

  // ── LOADING ──
  function showLoading() {
    document.getElementById('leads-container').innerHTML = `
      <div class="loading">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>`;
  }

  // ── UTILS ──
  function esc(str) {
    return String(str||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  function formatTime(ts) {
    const d   = new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000)   return 'just now';
    if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
    if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
    return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' · ' +
           d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function downloadCSV() {
    window.location.href = `/api/export-csv?tenant_id=${tid}&secret_key=${sk}`;
    showToast('Downloading contacts...');
  }

  function logout() {
    localStorage.clear();
    window.location.href = '/index.html';
  }

  // ── INIT ──
  loadLeads();
  setInterval(loadLeads, 60000);
</script>
</body>
</html>
