<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RingReady — Get Started</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #e8e8e8; font-family: system-ui, sans-serif; padding: 40px 20px; }
  .container { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 28px; margin-bottom: 8px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 40px; }
  .field { margin-bottom: 20px; }
  label { font-size: 13px; color: #888; display: block; margin-bottom: 8px; }
  input, select, textarea { width: 100%; background: #1a1a1a; border: 1px solid #333;
    color: #e8e8e8; padding: 12px 16px; border-radius: 6px; font-size: 14px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #ff2d20; }
  textarea { height: 80px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .check-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .check-row input { width: auto; }
  .check-row label { margin: 0; color: #ccc; }
  button { width: 100%; background: #ff2d20; color: white; border: none; padding: 16px;
    border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 24px; }
  button:disabled { background: #444; cursor: not-allowed; }
  .success { background: #0a2a0a; border: 1px solid #2a6; color: #4d4; padding: 24px;
    border-radius: 8px; text-align: center; display: none; }
  .error { background: #2a0a0a; border: 1px solid #f44; color: #f88; padding: 12px;
    border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none; }
  .divider { border: none; border-top: 1px solid #222; margin: 28px 0; }
  small { font-size: 11px; color: #555; display: block; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>Get Started with RingReady</h1>
  <p class="sub">Set up your AI receptionist in minutes. Your secret key will be sent to you after review.</p>

  <div class="error" id="err"></div>
  <div class="success" id="success">
    <h2 style="margin-bottom:12px">You're on the list!</h2>
    <p style="color:#888;font-size:14px">We'll send your secret key within a few hours. Keep an eye on your email.</p>
  </div>

  <div id="form">
    <div class="row">
      <div class="field">
        <label>Business Name *</label>
        <input type="text" id="business_name" placeholder="Joe's Plumbing" />
      </div>
      <div class="field">
        <label>Your Name *</label>
        <input type="text" id="owner_name" placeholder="Joe Smith" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Email *</label>
        <input type="email" id="owner_email" placeholder="joe@example.com" />
      </div>
      <div class="field">
        <label>Phone *</label>
        <input type="tel" id="owner_phone" placeholder="+1 555 0100" />
      </div>
    </div>

    <div class="field">
      <label>WhatsApp Number * <small>For urgent lead alerts</small></label>
      <input type="tel" id="owner_whatsapp" placeholder="+1 555 0100" />
    </div>

    <div class="field">
      <label>Website URL</label>
      <input type="url" id="website" placeholder="https://joesplumbing.com" />
    </div>

    <div class="field">
      <label>Service Types * <small>Comma separated: plumbing, drain cleaning, water heaters</small></label>
      <input type="text" id="service_types" placeholder="plumbing, drain cleaning, water heaters" />
    </div>

    <div class="field">
      <label>Service Location * <small>City, state and radius: Houston TX within 40 miles</small></label>
      <input type="text" id="service_location" placeholder="Houston TX within 40 miles" />
    </div>

    <div class="row">
      <div class="field">
        <label>Team Size</label>
        <select id="team_size">
          <option value="1">Just me</option>
          <option value="2">2-5</option>
          <option value="6">6-10</option>
          <option value="11">11+</option>
        </select>
      </div>
      <div class="field">
        <label>Approximate Missed Calls/Month</label>
        <select id="missed_calls">
          <option value="1-10">1-10</option>
          <option value="10-30">10-30</option>
          <option value="30-50">30-50</option>
          <option value="50+">50+</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Gemini API Key * <small>Get free at aistudio.google.com — you pay Google directly, not us</small></label>
      <input type="text" id="gemini_api_key" placeholder="AIza..." />
    </div>

    <hr class="divider" />

    <div class="check-row">
      <input type="checkbox" id="ads_running" />
      <label for="ads_running">Currently running Google/Facebook ads</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="google_business" />
      <label for="google_business">Have a Google Business Profile</label>
    </div>

    <hr class="divider" />

    <div class="field">
      <label>Referral Code <small>If someone referred you</small></label>
      <input type="text" id="referral_code" placeholder="JOHN2024" />
    </div>

    <button id="btn" onclick="submitForm()">Submit Application</button>
  </div>
</div>

<script>
async function submitForm() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  document.getElementById('err').style.display = 'none';

  const service_types_raw = document.getElementById('service_types').value;
  const service_types = service_types_raw.split(',').map(s => s.trim()).filter(Boolean);

  const body = {
    business_name: document.getElementById('business_name').value.trim(),
    owner_name: document.getElementById('owner_name').value.trim(),
    owner_email: document.getElementById('owner_email').value.trim().toLowerCase(),
    owner_phone: document.getElementById('owner_phone').value.trim(),
    owner_whatsapp: document.getElementById('owner_whatsapp').value.trim(),
    website: document.getElementById('website').value.trim(),
    service_types,
    service_location: document.getElementById('service_location').value.trim(),
    team_size: document.getElementById('team_size').value,
    gemini_api_key: document.getElementById('gemini_api_key').value.trim(),
    ads_running: document.getElementById('ads_running').checked,
    google_business: document.getElementById('google_business').checked,
    referral_code: document.getElementById('referral_code').value.trim().toUpperCase()
  };

  if (!body.business_name || !body.owner_email || !body.owner_phone || !body.gemini_api_key || !service_types.length || !body.service_location) {
    document.getElementById('err').textContent = 'Please fill in all required fields.';
    document.getElementById('err').style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Submit Application';
    return;
  }

  try {
    const res = await fetch('/api/onboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (!res.ok) {
      document.getElementById('err').textContent = data.error || 'Something went wrong.';
      document.getElementById('err').style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Submit Application';
      return;
    }

    document.getElementById('form').style.display = 'none';
    document.getElementById('success').style.display = 'block';
  } catch {
    document.getElementById('err').textContent = 'Connection error. Try again.';
    document.getElementById('err').style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Submit Application';
  }
}
</script>
</body>
</html>
