<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RingReady — Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #e8e8e8; font-family: system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .box { background: #111; border: 1px solid #222; padding: 48px; width: 100%; max-width: 400px; border-radius: 8px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p { color: #666; font-size: 14px; margin-bottom: 32px; }
  label { font-size: 13px; color: #888; display: block; margin-bottom: 8px; }
  input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #e8e8e8;
    padding: 12px 16px; border-radius: 6px; font-size: 15px; letter-spacing: 2px; margin-bottom: 16px; }
  input:focus { outline: none; border-color: #ff2d20; }
  button { width: 100%; background: #ff2d20; color: white; border: none; padding: 14px;
    border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #e02010; }
  .error { background: #2a0a0a; border: 1px solid #ff2d20; color: #ff6b6b;
    padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<div class="box">
  <h1>RingReady</h1>
  <p>Enter your secret key to access your dashboard</p>
  <div class="error" id="err"></div>
  <label>Secret Key</label>
  <input type="text" id="key" placeholder="RR-XXXXXXXXXXXX" autocomplete="off" />
  <button onclick="login()">Access Dashboard</button>
</div>
<script>
  // Already logged in?
  if (localStorage.getItem('rr_tenant_id')) window.location.href = '/dashboard.html';

  async function login() {
    const key = document.getElementById('key').value.trim().toUpperCase();
    if (!key) return showError('Enter your secret key');

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret_key: key })
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error || 'Invalid key');

      localStorage.setItem('rr_tenant_id', data.tenant_id);
      localStorage.setItem('rr_secret_key', key);
      localStorage.setItem('rr_business_name', data.business_name);
      window.location.href = '/dashboard.html';
    } catch {
      showError('Connection error. Try again.');
    }
  }

  function showError(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.style.display = 'block';
  }

  document.getElementById('key').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
