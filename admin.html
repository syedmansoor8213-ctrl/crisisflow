<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrisisFlow — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --surface: #0f0f0f;
    --surface2: #161616;
    --border: #1e1e1e;
    --border2: #2a2a2a;
    --text: #f0f0f0;
    --muted: #555;
    --dim: #333;
    --red: #ff3b2f;
    --red-dim: rgba(255,59,47,0.1);
    --green: #30d158;
    --green-dim: rgba(48,209,88,0.1);
    --yellow: #ffd60a;
    --yellow-dim: rgba(255,214,10,0.1);
    --accent: #ff3b2f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── LOGIN ── */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  #login-screen::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 60% 40%, rgba(255,59,47,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  .login-wrap {
    width: 100%;
    max-width: 400px;
    padding: 20px;
    animation: fadeUp 0.5s ease forwards;
  }

  .login-logo {
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    color: var(--red);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .login-logo::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--red);
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px var(--red);
  }

  .login-title {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .login-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 40px;
    font-weight: 400;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 16px;
  }

  .input-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 16px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 3px;
    transition: border-color 0.2s;
    outline: none;
  }

  .input-wrap input:focus {
    border-color: var(--red);
    background: var(--surface2);
  }

  .input-wrap input::placeholder {
    letter-spacing: 1px;
    color: var(--muted);
  }

  .login-btn {
    width: 100%;
    background: var(--red);
    color: white;
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Syne', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .login-btn:hover {
    background: #e02d22;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(255,59,47,0.3);
  }

  .login-btn:active { transform: translateY(0); }

  .login-err {
    color: var(--red);
    font-size: 13px;
    margin-top: 12px;
    font-family: 'DM Mono', monospace;
    display: none;
    padding: 12px 16px;
    background: var(--red-dim);
    border-radius: 8px;
    border: 1px solid rgba(255,59,47,0.2);
  }

  /* ── PANEL ── */
  #panel { display: none; }

  /* ── HEADER ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8,8,8,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-logo {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .header-logo span {
    color: var(--red);
  }

  .header-divider {
    width: 1px;
    height: 20px;
    background: var(--border2);
  }

  .header-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .client-count-badge {
    background: var(--surface2);
    border: 1px solid var(--border2);
    padding: 4px 12px;
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .client-count-badge span {
    color: var(--text);
    font-weight: 500;
  }

  .logout-btn {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Syne', sans-serif;
    font-weight: 500;
    transition: all 0.2s;
  }

  .logout-btn:hover {
    border-color: var(--red);
    color: var(--red);
  }

  /* ── CONTROLS ── */
  .controls {
    padding: 24px 32px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .search-wrap {
    flex: 1;
    min-width: 240px;
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }

  .search {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 12px 16px 12px 42px;
    border-radius: 10px;
    font-size: 14px;
    font-family: 'DM Mono', monospace;
    outline: none;
    transition: border-color 0.2s;
  }

  .search:focus { border-color: var(--red); }
  .search::placeholder { color: var(--muted); }

  .filter-group {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border2);
    padding: 4px;
    border-radius: 10px;
  }

  .filter {
    padding: 7px 14px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter:hover { color: var(--text); }

  .filter.active {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border2);
  }

  /* ── TABLE WRAPPER ── */
  .table-wrap {
    padding: 24px 32px 60px;
    overflow-x: auto;
  }

  /* ── CARDS LAYOUT (replaces table on mobile) ── */
  .clients-grid {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* ── CLIENT ROW ── */
  .client-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    display: grid;
    grid-template-columns: 2fr 2fr 1.5fr 1.5fr 1fr 1fr auto;
    align-items: center;
    gap: 16px;
    transition: all 0.15s;
    animation: fadeUp 0.3s ease forwards;
    opacity: 0;
  }

  .client-row:hover {
    background: var(--surface2);
    border-color: var(--border2);
    transform: translateX(2px);
  }

  /* Table header */
  .table-header {
    display: grid;
    grid-template-columns: 2fr 2fr 1.5fr 1.5fr 1fr 1fr auto;
    gap: 16px;
    padding: 0 24px 12px;
    margin-bottom: 8px;
  }

  .table-header span {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .col-business { min-width: 0; }

  .biz-name {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .biz-owner {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .col-email {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mono-field {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mono-val {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100px;
  }

  .copy-btn {
    background: var(--surface2);
    border: 1px solid var(--dim);
    color: var(--muted);
    padding: 3px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .copy-btn:hover {
    background: var(--border2);
    color: var(--text);
  }

  .copy-btn.copied {
    background: var(--green-dim);
    border-color: var(--green);
    color: var(--green);
  }

  .col-service {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .status-pill::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-active {
    background: var(--green-dim);
    color: var(--green);
    border: 1px solid rgba(48,209,88,0.2);
  }

  .status-active::before { background: var(--green); box-shadow: 0 0 4px var(--green); }

  .status-frozen {
    background: rgba(255,214,10,0.08);
    color: var(--yellow);
    border: 1px solid rgba(255,214,10,0.2);
  }

  .status-frozen::before { background: var(--yellow); }

  .actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
  }

  .action-btn {
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    transition: all 0.15s;
    border: 1px solid transparent;
    white-space: nowrap;
  }

  .btn-freeze {
    background: var(--yellow-dim);
    color: var(--yellow);
    border-color: rgba(255,214,10,0.2);
  }

  .btn-freeze:hover {
    background: rgba(255,214,10,0.15);
    border-color: var(--yellow);
  }

  .btn-unfreeze {
    background: var(--green-dim);
    color: var(--green);
    border-color: rgba(48,209,88,0.2);
  }

  .btn-unfreeze:hover {
    background: rgba(48,209,88,0.15);
    border-color: var(--green);
  }

  .btn-delete {
    background: var(--red-dim);
    color: var(--red);
    border-color: rgba(255,59,47,0.2);
  }

  .btn-delete:hover {
    background: rgba(255,59,47,0.15);
    border-color: var(--red);
  }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center;
    padding: 80px 24px;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 40px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .empty h3 {
    font-size: 18px;
    color: var(--text);
    margin-bottom: 8px;
  }

  .empty p { font-size: 14px; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    z-index: 9999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  /* ── CONFIRM MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
    margin: 20px;
    transform: scale(0.95);
    transition: transform 0.2s;
  }

  .modal-overlay.show .modal { transform: scale(1); }

  .modal h3 { font-size: 18px; margin-bottom: 8px; }
  .modal p { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }

  .modal-actions { display: flex; gap: 10px; }

  .modal-cancel {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.15s;
  }

  .modal-cancel:hover { color: var(--text); border-color: var(--border2); }

  .modal-confirm {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    transition: all 0.15s;
  }

  .modal-confirm.danger { background: var(--red); color: white; }
  .modal-confirm.warn { background: var(--yellow); color: #000; }
  .modal-confirm:hover { opacity: 0.9; transform: translateY(-1px); }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 1024px) {
    .client-row, .table-header {
      grid-template-columns: 2fr 2fr 1fr 1fr auto;
    }
    .col-service, .col-referral { display: none; }
    .table-header .th-service,
    .table-header .th-referral { display: none; }
  }

  @media (max-width: 768px) {
    .header { padding: 0 16px; }
    .controls { padding: 16px; }
    .table-wrap { padding: 16px 16px 60px; }
    .client-row { grid-template-columns: 1fr auto; gap: 12px; padding: 16px; }
    .table-header { display: none; }
    .col-email, .col-tenant, .col-key, .col-service, .col-referral, .col-joined { display: none; }
    .col-status { display: none; }
  }
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Are you sure?</h3>
    <p id="modal-body">This action cannot be undone.</p>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-confirm" id="modal-confirm-btn" onclick="confirmAction()">Confirm</button>
    </div>
  </div>
</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-logo">CrisisFlow Admin</div>
    <h1 class="login-title">Welcome<br>back.</h1>
    <p class="login-sub">Enter your admin password to continue.</p>
    <div class="input-wrap">
      <input type="password" id="admin-pwd" placeholder="Admin password" autocomplete="current-password" />
    </div>
    <button class="login-btn" onclick="adminLogin()">Enter →</button>
    <div class="login-err" id="login-err">Wrong password. Try again.</div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="panel">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">Crisis<span>Flow</span></div>
      <div class="header-divider"></div>
      <div class="header-tag">Admin</div>
      <div class="client-count-badge"><span id="client-count">0</span> clients</div>
    </div>
    <button class="logout-btn" onclick="adminLogout()">Sign out</button>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search" id="search" placeholder="Search business, email, tenant ID, key, referral..." oninput="filterClients()" />
    </div>
    <div class="filter-group">
      <button class="filter active" onclick="setFilter('all',this)">All</button>
      <button class="filter" onclick="setFilter('today',this)">Today</button>
      <button class="filter" onclick="setFilter('week',this)">Week</button>
      <button class="filter" onclick="setFilter('month',this)">Month</button>
      <button class="filter" onclick="setFilter('year',this)">Year</button>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <span>Business</span>
      <span>Email</span>
      <span class="th-service">Service</span>
      <span>Tenant ID</span>
      <span class="th-referral">Referral</span>
      <span>Status</span>
      <span>Actions</span>
    </div>
    <div class="clients-grid" id="clients-grid"></div>
  </div>
</div>

<script>
  let adminPwd = '';
  let allClients = [];
  let currentFilter = 'all';
  let pendingAction = null;

  // ── LOGIN ──
  function adminLogin() {
    const pwd = document.getElementById('admin-pwd').value;
    if (!pwd) return;
    adminPwd = pwd;
    document.getElementById('login-err').style.display = 'none';
    loadClients();
  }

  function adminLogout() {
    adminPwd = '';
    allClients = [];
    document.getElementById('panel').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('admin-pwd').value = '';
  }

  document.getElementById('admin-pwd').addEventListener('keydown', e => {
    if (e.key === 'Enter') adminLogin();
  });

  // ── LOAD CLIENTS ──
  async function loadClients() {
    try {
      const res = await fetch(`/api/admin-clients?filter=${currentFilter}`, {
        headers: { 'x-admin-password': adminPwd }
      });

      if (res.status === 401) {
        document.getElementById('login-err').style.display = 'block';
        adminPwd = '';
        return;
      }

      const data = await res.json();
      allClients = data.clients || [];
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
      filterClients();
    } catch {
      showToast('Failed to load clients');
    }
  }

  // ── FILTER + SEARCH ──
  function filterClients() {
    const search = document.getElementById('search').value.toLowerCase();
    const results = search ? allClients.filter(c =>
      (c.tenant_id||'').toLowerCase().includes(search) ||
      (c.owner_email||'').toLowerCase().includes(search) ||
      (c.secret_key||'').toLowerCase().includes(search) ||
      (c.referral_code||'').toLowerCase().includes(search) ||
      (c.business_name||'').toLowerCase().includes(search) ||
      (c.owner_name||'').toLowerCase().includes(search)
    ) : allClients;

    document.getElementById('client-count').textContent = results.length;
    renderClients(results);
  }

  // ── RENDER ──
  function renderClients(clients) {
    const grid = document.getElementById('clients-grid');

    if (!clients.length) {
      grid.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔍</div>
          <h3>No clients found</h3>
          <p>Try a different search or filter</p>
        </div>`;
      return;
    }

    grid.innerHTML = clients.map((c, i) => `
      <div class="client-row" style="animation-delay:${i * 30}ms" id="row-${c.tenant_id}">

        <div class="col-business">
          <div class="biz-name">${esc(c.business_name)}</div>
          <div class="biz-owner">${esc(c.owner_name)}</div>
        </div>

        <div class="col-email">${esc(c.owner_email)}</div>

        <div class="col-service">${(c.service_types||[]).slice(0,2).join(', ')}${(c.service_types||[]).length > 2 ? ' +' + ((c.service_types||[]).length - 2) : ''}</div>

        <div class="col-tenant mono-field">
          <span class="mono-val" title="${c.tenant_id}">${c.tenant_id.substring(0,12)}…</span>
          <button class="copy-btn" onclick="copyText('${c.tenant_id}', this)">copy</button>
        </div>

        <div class="col-referral" style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)">
          ${esc(c.referral_code || '—')}
        </div>

        <div>
          <span class="status-pill status-${c.status}">${c.status}</span>
        </div>

        <div class="actions">
          ${c.status === 'frozen'
            ? `<button class="action-btn btn-unfreeze" onclick="confirmFreeze('${c.tenant_id}','unfreeze','${esc(c.business_name)}')">Unfreeze</button>`
            : `<button class="action-btn btn-freeze" onclick="confirmFreeze('${c.tenant_id}','freeze','${esc(c.business_name)}')">Freeze</button>`
          }
          <button class="action-btn btn-delete" onclick="confirmDelete('${c.tenant_id}','${esc(c.business_name)}')">Delete</button>
        </div>

      </div>
    `).join('');
  }

  // ── MODAL ──
  function showModal(title, body, btnText, btnClass, action) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').textContent = body;
    const btn = document.getElementById('modal-confirm-btn');
    btn.textContent = btnText;
    btn.className = `modal-confirm ${btnClass}`;
    pendingAction = action;
    document.getElementById('modal-overlay').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('show');
    pendingAction = null;
  }

  async function confirmAction() {
    if (pendingAction) await pendingAction();
    closeModal();
  }

  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });

  // ── FREEZE ──
  function confirmFreeze(tenant_id, action, name) {
    const isFreeze = action === 'freeze';
    showModal(
      isFreeze ? `Freeze ${name}?` : `Unfreeze ${name}?`,
      isFreeze
        ? 'Their dashboard will go dark and the AI will stop answering calls. You can unfreeze anytime.'
        : 'Their account will be restored immediately.',
      isFreeze ? 'Freeze account' : 'Unfreeze account',
      isFreeze ? 'warn' : 'danger',
      () => doFreeze(tenant_id, action)
    );
  }

  async function doFreeze(tenant_id, action) {
    try {
      const res = await fetch('/api/admin-freeze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPwd },
        body: JSON.stringify({ tenant_id, action })
      });
      if (!res.ok) throw new Error();
      const c = allClients.find(c => c.tenant_id === tenant_id);
      if (c) c.status = action === 'freeze' ? 'frozen' : 'active';
      filterClients();
      showToast(action === 'freeze' ? 'Account frozen' : 'Account restored');
    } catch {
      showToast('Action failed — try again');
    }
  }

  // ── DELETE ──
  function confirmDelete(tenant_id, name) {
    showModal(
      `Delete ${name}?`,
      'This will permanently delete the client and all their leads, contacts, and data. This cannot be undone.',
      'Delete permanently',
      'danger',
      () => doDelete(tenant_id)
    );
  }

  async function doDelete(tenant_id) {
    try {
      const res = await fetch('/api/admin-delete', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPwd },
        body: JSON.stringify({ tenant_id })
      });
      if (!res.ok) throw new Error();
      allClients = allClients.filter(c => c.tenant_id !== tenant_id);
      const row = document.getElementById(`row-${tenant_id}`);
      if (row) {
        row.style.transition = 'all 0.3s';
        row.style.opacity = '0';
        row.style.transform = 'translateX(-20px)';
        setTimeout(() => row.remove(), 300);
      }
      document.getElementById('client-count').textContent = allClients.length;
      showToast('Client deleted');
    } catch {
      showToast('Delete failed — try again');
    }
  }

  // ── FILTER ──
  function setFilter(filter, el) {
    currentFilter = filter;
    document.querySelectorAll('.filter').forEach(f => f.classList.remove('active'));
    el.classList.add('active');
    loadClients();
  }

  // ── COPY ──
  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✓ done';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'copy';
        btn.classList.remove('copied');
      }, 1500);
    });
  }

  // ── TOAST ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── ESCAPE ──
  function esc(str) {
    return String(str||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  // ── KEYBOARD ──
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      document.getElementById('search')?.focus();
      e.preventDefault();
    }
  });
</script>
</body>
</html>
