<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrisisFlow — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#08080e; --surface:#0f0f18; --border:#1c1c2c; --accent:#ff4d00; --text:#e0e0ef; --muted:#444460; --card:#111119; --emergency:#ff2d2d; --qualified:#00c896; --frozen:#4444ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
  .admin-login { display:flex; position:fixed; inset:0; background:var(--bg); align-items:center; justify-content:center; z-index:999; }
  .admin-login.hide { display:none; }
  .admin-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:36px; width:340px; }
  .admin-logo { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; margin-bottom:4px; }
  .admin-logo span { color:var(--accent); }
  .admin-sub { font-size:12px; color:var(--muted); margin-bottom:28px; }
  .inp { width:100%; padding:11px 13px; background:var(--card); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; font-family:'DM Sans',sans-serif; margin-bottom:12px; }
  .inp:focus { outline:none; border-color:var(--accent); }
  .submit-btn { width:100%; padding:12px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-family:'Syne',sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .admin-wrap { display:none; }
  .admin-wrap.show { display:block; }
  .topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:16px 28px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:50; }
  .topbar-logo { font-family:'Syne',sans-serif; font-size:18px; font-weight:800; }
  .topbar-logo span { color:var(--accent); }
  .topbar-right { margin-left:auto; display:flex; gap:10px; }
  .btn { padding:8px 14px; border-radius:7px; border:none; cursor:pointer; font-size:12px; font-family:'DM Sans',sans-serif; transition:all 0.2s; }
  .btn-ghost { background:var(--surface); border:1px solid var(--border); color:var(--text); }
  .btn-ghost:hover { border-color:var(--muted); }
  .btn-accent { background:var(--accent); color:#fff; }
  .main { padding:28px; }
  .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; border-top:2px solid transparent; }
  .stat.s-total { border-top-color:var(--accent); }
  .stat.s-active { border-top-color:var(--qualified); }
  .stat.s-frozen { border-top-color:var(--frozen); }
  .stat.s-today { border-top-color:#ffaa00; }
  .stat-l { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:6px; }
  .stat-n { font-family:'Syne',sans-serif; font-size:28px; font-weight:700; }
  .stat.s-total .stat-n { color:var(--accent); }
  .stat.s-active .stat-n { color:var(--qualified); }
  .stat.s-frozen .stat-n { color:var(--frozen); }
  .controls { display:flex; gap:12px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
  .search-inp { padding:9px 14px; background:var(--card); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; font-family:'DM Sans',sans-serif; width:280px; }
  .search-inp:focus { outline:none; border-color:var(--accent); }
  .filter-btn { padding:7px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:12px; cursor:pointer; transition:all 0.2s; }
  .table-wrap { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  thead th { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); background:var(--surface); }
  tbody td { padding:13px 14px; border-bottom:1px solid #0c0c18; font-size:12px; vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover td { background:#0e0e1c; }
  .company-cell { font-weight:600; font-size:13px; }
  .company-sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .key-cell { font-family:'DM Mono',monospace; font-size:11px; color:#888; cursor:pointer; }
  .key-cell:hover { color:var(--text); }
  .status-pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .pill-active { background:#001a10; color:var(--qualified); border:1px solid #003a28; }
  .pill-frozen { background:#0a0a2a; color:#8888ff; border:1px solid #2a2a55; }
  .pill-dot { width:6px; height:6px; border-radius:50%; }
  .pill-active .pill-dot { background:var(--qualified); }
  .pill-frozen .pill-dot { background:#8888ff; }
  .actions { display:flex; gap:6px; }
  .act-btn { padding:5px 10px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:11px; cursor:pointer; transition:all 0.2s; }
  .act-freeze:hover { border-color:#8888ff; color:#8888ff; }
  .act-unfreeze { border-color:#8888ff; color:#8888ff; }
  .act-delete:hover { border-color:var(--emergency); color:var(--emergency); }
  .act-view:hover { border-color:var(--accent); color:var(--accent); }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(4px); z-index:500; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px; width:540px; max-height:88vh; overflow-y:auto; }
  .modal h2 { font-family:'Syne',sans-serif; font-size:18px; margin-bottom:20px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-full { grid-column:1/-1; }
  .form-group { display:flex; flex-direction:column; gap:5px; }
  .form-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
  .form-inp { padding:10px 12px; background:var(--card); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; font-family:'DM Sans',sans-serif; }
  .form-inp:focus { outline:none; border-color:var(--accent); }
  .modal-actions { display:flex; gap:10px; margin-top:20px; }
  .modal-close-btn { flex:1; padding:11px; background:var(--card); border:1px solid var(--border); border-radius:8px; color:var(--text); cursor:pointer; font-family:'DM Sans',sans-serif; }
  .modal-save-btn { flex:2; padding:11px; background:var(--accent); border:none; border-radius:8px; color:#fff; cursor:pointer; font-family:'Syne',sans-serif; font-weight:700; }
  .detail-panel { position:fixed; right:-500px; top:0; bottom:0; width:460px; background:var(--surface); border-left:1px solid var(--border); z-index:400; transition:right 0.3s; overflow-y:auto; padding:28px; }
  .detail-panel.open { right:0; }
  .detail-close { float:right; background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; }
  .detail-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; margin-bottom:20px; }
  .detail-row { display:flex; flex-direction:column; gap:3px; margin-bottom:14px; }
  .detail-label { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .detail-val { font-size:13px; color:var(--text); font-family:'DM Mono',monospace; word-break:break-all; }
  .detail-section { font-family:'Syne',sans-serif; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:20px 0 10px; border-top:1px solid var(--border); padding-top:16px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(60px); background:#1a2a1a; border:1px solid var(--qualified); color:var(--qualified); padding:10px 20px; border-radius:8px; font-size:13px; opacity:0; transition:all 0.3s; z-index:9999; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  .empty-row td { text-align:center; color:var(--muted); padding:40px; }
  .divider { grid-column:1/-1; border-top:1px solid var(--border); padding-top:14px; margin-top:4px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
</style>
</head>
<body>

<div class="admin-login" id="adminLogin">
  <div class="admin-box">
    <div class="admin-logo">Crisis<span>Flow</span></div>
    <div class="admin-sub">🔐 Master Admin — Restricted</div>
    <input class="inp" type="text" id="adminUser" placeholder="Admin Username" />
    <input class="inp" type="password" id="adminPass" placeholder="Admin Password" />
    <button class="submit-btn" onclick="adminLogin()">Access Panel →</button>
  </div>
</div>

<div class="admin-wrap" id="adminWrap">
  <div class="topbar">
    <div class="topbar-logo">Crisis<span>Flow</span> <span style="font-size:12px;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;">Admin</span></div>
    <div class="topbar-right">
      <button class="btn btn-ghost" onclick="loadTenants()">⟳ Refresh</button>
      <button class="btn btn-accent" onclick="openAddModal()">+ Add Tenant</button>
      <button class="btn btn-ghost" onclick="adminLogout()">Sign Out</button>
    </div>
  </div>
  <div class="main">
    <div class="stats-row">
      <div class="stat s-total"><div class="stat-l">Total Clients</div><div class="stat-n" id="stTotal">0</div></div>
      <div class="stat s-active"><div class="stat-l">Active</div><div class="stat-n" id="stActive">0</div></div>
      <div class="stat s-frozen"><div class="stat-l">Frozen</div><div class="stat-n" id="stFrozen">0</div></div>
      <div class="stat s-today"><div class="stat-l">Added Today</div><div class="stat-n" id="stToday">0</div></div>
    </div>
    <div class="controls">
      <input class="search-inp" type="text" id="searchInp" placeholder="Search by name, email, phone, ID..." oninput="filterTenants()" />
      <button class="filter-btn" id="fa" onclick="setFilter('all')" style="border-color:var(--accent);color:var(--accent);">All</button>
      <button class="filter-btn" id="fac" onclick="setFilter('active')">Active</button>
      <button class="filter-btn" id="ff" onclick="setFilter('frozen')">Frozen</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Company</th><th>Tenant ID</th><th>Secret Key (click to reveal)</th><th>Referral</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
        <tbody id="tenantTable"><tr class="empty-row"><td colspan="7">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>➕ Add New Tenant</h2>
    <div class="form-grid">
      <div class="form-group form-full"><label class="form-label">Company Name *</label><input class="form-inp" id="f_company" placeholder="Bob's Heating & Air" /></div>
      <div class="form-group"><label class="form-label">Owner Name *</label><input class="form-inp" id="f_owner" placeholder="Bob Smith" /></div>
      <div class="form-group"><label class="form-label">Owner Email *</label><input class="form-inp" type="email" id="f_email" placeholder="bob@company.com" /></div>
      <div class="form-group"><label class="form-label">Phone</label><input class="form-inp" id="f_phone" placeholder="+1 555 000 0000" /></div>
      <div class="form-group"><label class="form-label">Business Type</label><input class="form-inp" id="f_type" placeholder="HVAC / Plumber" /></div>
      <div class="form-group form-full"><label class="form-label">Service Cities (comma separated)</label><input class="form-inp" id="f_cities" placeholder="Dallas, Fort Worth, Arlington" /></div>
      <div class="form-group"><label class="form-label">Referral Name</label><input class="form-inp" id="f_ref_name" placeholder="Salesman name" /></div>
      <div class="form-group"><label class="form-label">Referral Email</label><input class="form-inp" id="f_ref_email" placeholder="salesman@email.com" /></div>
      <div class="divider">API Keys (BYO — tenant's own accounts)</div>
      <div class="form-group"><label class="form-label">Vapi Assistant ID</label><input class="form-inp" id="f_vapi" placeholder="asst_xxxxxxxxxx" /></div>
      <div class="form-group"><label class="form-label">Gemini API Key</label><input class="form-inp" id="f_gemini" placeholder="AIzaSy..." /></div>
      <div class="form-group"><label class="form-label">Brevo SMTP Login</label><input class="form-inp" id="f_brevo_user" placeholder="their@email.com" /></div>
      <div class="form-group"><label class="form-label">Brevo SMTP Key</label><input class="form-inp" id="f_brevo_key" placeholder="xsmtpsib-..." /></div>
      <div class="form-group"><label class="form-label">WhatsApp Phone</label><input class="form-inp" id="f_wa_phone" placeholder="+15551234567" /></div>
      <div class="form-group"><label class="form-label">CallMeBot API Key</label><input class="form-inp" id="f_wa_key" placeholder="1234567" /></div>
    </div>
    <div class="modal-actions">
      <button class="modal-close-btn" onclick="closeAddModal()">Cancel</button>
      <button class="modal-save-btn" onclick="saveTenant()">Create Tenant + Generate Key →</button>
    </div>
  </div>
</div>

<div class="detail-panel" id="detailPanel">
  <button class="detail-close" onclick="closeDetail()">✕</button>
  <div class="detail-title" id="dp_title"></div>
  <div id="dp_content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const ADMIN_USER = 'admin';
const ADMIN_PASS = 'crisisflow2026!'; // CHANGE THIS

let allTenants = [], currentFilter = 'all';

function adminLogin() {
  if (document.getElementById('adminUser').value===ADMIN_USER && document.getElementById('adminPass').value===ADMIN_PASS) {
    localStorage.setItem('cf_admin','1');
    document.getElementById('adminLogin').classList.add('hide');
    document.getElementById('adminWrap').classList.add('show');
    loadTenants();
  } else { alert('❌ Wrong credentials'); }
}
function adminLogout() { localStorage.removeItem('cf_admin'); location.reload(); }
if (localStorage.getItem('cf_admin')) {
  document.getElementById('adminLogin').classList.add('hide');
  document.getElementById('adminWrap').classList.add('show');
}

async function sb(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', 'Prefer': options.prefer||'return=representation', ...options.headers },
    ...options
  });
  const text = await res.text(); return text ? JSON.parse(text) : null;
}

async function loadTenants() {
  allTenants = await sb('tenants?select=*&order=created_at.desc').catch(()=>[]) || [];
  const today = allTenants.filter(t=>new Date(t.created_at).toDateString()===new Date().toDateString());
  document.getElementById('stTotal').textContent = allTenants.length;
  document.getElementById('stActive').textContent = allTenants.filter(t=>t.status!=='frozen').length;
  document.getElementById('stFrozen').textContent = allTenants.filter(t=>t.status==='frozen').length;
  document.getElementById('stToday').textContent = today.length;
  filterTenants();
}

function filterTenants() {
  const q = document.getElementById('searchInp').value.toLowerCase();
  let list = allTenants.filter(t=>{
    if (currentFilter==='active'&&t.status==='frozen') return false;
    if (currentFilter==='frozen'&&t.status!=='frozen') return false;
    if (!q) return true;
    return [(t.company_name||''),(t.owner_email||''),(t.phone||''),(t.id||''),(t.secret_key||'')].some(v=>v.toLowerCase().includes(q));
  });
  renderTable(list);
}

function setFilter(f) {
  currentFilter = f;
  ['fa','fac','ff'].forEach(id=>{ document.getElementById(id).style.borderColor=''; document.getElementById(id).style.color=''; });
  const el = f==='all'?'fa':f==='active'?'fac':'ff';
  document.getElementById(el).style.borderColor='var(--accent)'; document.getElementById(el).style.color='var(--accent)';
  filterTenants();
}

function renderTable(list) {
  const tb = document.getElementById('tenantTable');
  if (!list.length) { tb.innerHTML='<tr class="empty-row"><td colspan="7">No tenants found</td></tr>'; return; }
  tb.innerHTML = list.map(t=>`<tr>
    <td><div class="company-cell">${t.company_name||'—'}</div><div class="company-sub">${t.owner_email||'—'}</div></td>
    <td style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)">${t.id.slice(0,12)}...</td>
    <td><div class="key-cell" onclick="revealKey(this,'${t.secret_key}')">${maskKey(t.secret_key)}</div></td>
    <td style="font-size:12px;color:var(--muted)">${t.referral_name||'—'}</td>
    <td>${t.status==='frozen'?'<span class="status-pill pill-frozen"><div class="pill-dot"></div>Frozen</span>':'<span class="status-pill pill-active"><div class="pill-dot"></div>Active</span>'}</td>
    <td style="font-size:11px;color:var(--muted)">${new Date(t.created_at).toLocaleDateString()}</td>
    <td><div class="actions">
      <button class="act-btn act-view" onclick="viewDetail('${t.id}')">View</button>
      ${t.status==='frozen'?`<button class="act-btn act-unfreeze" onclick="toggleFreeze('${t.id}','active')">Unfreeze</button>`:`<button class="act-btn act-freeze" onclick="toggleFreeze('${t.id}','frozen')">Freeze</button>`}
      <button class="act-btn act-delete" onclick="deleteTenant('${t.id}')">Delete</button>
    </div></td>
  </tr>`).join('');
}

function maskKey(k) { return k ? k.slice(0,8)+'••••••••' : '—'; }
function revealKey(el, key) {
  el.textContent = key; navigator.clipboard.writeText(key).catch(()=>{});
  showToast('✓ Key copied!'); setTimeout(()=>{ el.textContent=maskKey(key); },5000);
}

async function toggleFreeze(id, status) {
  await sb(`tenants?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status}),headers:{'Prefer':'return=minimal'}});
  showToast(status==='frozen'?'🔒 Frozen':'✅ Unfrozen'); loadTenants();
}

async function deleteTenant(id) {
  if (!confirm('DELETE this tenant? Cannot be undone.')) return;
  await sb(`tenants?id=eq.${id}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});
  await sb(`leads?tenant_id=eq.${id}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});
  showToast('🗑 Deleted'); loadTenants();
}

function openAddModal() { document.getElementById('addModal').classList.add('open'); }
function closeAddModal() { document.getElementById('addModal').classList.remove('open'); }

function generateKey() {
  return 'sk-'+Array.from(crypto.getRandomValues(new Uint8Array(20))).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function saveTenant() {
  const company = document.getElementById('f_company').value.trim();
  const email = document.getElementById('f_email').value.trim();
  if (!company||!email) { alert('Company name and email are required.'); return; }
  const secret_key = generateKey();
  const data = {
    company_name:company, owner_name:document.getElementById('f_owner').value.trim(),
    owner_email:email, phone:document.getElementById('f_phone').value.trim(),
    business_type:document.getElementById('f_type').value.trim(),
    service_cities:document.getElementById('f_cities').value.trim(),
    referral_name:document.getElementById('f_ref_name').value.trim(),
    referral_email:document.getElementById('f_ref_email').value.trim(),
    vapi_assistant_id:document.getElementById('f_vapi').value.trim(),
    gemini_api_key:document.getElementById('f_gemini').value.trim(),
    brevo_user:document.getElementById('f_brevo_user').value.trim(),
    brevo_smtp_key:document.getElementById('f_brevo_key').value.trim(),
    whatsapp_phone:document.getElementById('f_wa_phone').value.trim(),
    whatsapp_apikey:document.getElementById('f_wa_key').value.trim(),
    secret_key, status:'active', pulse_enabled:true,
    services:['AC Repair','Heating Repair','HVAC Install','Maintenance'],
    created_at:new Date().toISOString()
  };
  try {
    await sb('tenants',{method:'POST',body:JSON.stringify(data),headers:{'Prefer':'return=minimal'}});
    closeAddModal();
    alert(`✅ Tenant Created!\n\nEmail this key ONLY to the HVAC owner:\n\n${secret_key}`);
    loadTenants();
  } catch(e) { alert('Error: '+e.message); }
}

function viewDetail(id) {
  const t = allTenants.find(x=>x.id===id); if(!t) return;
  document.getElementById('dp_title').textContent = t.company_name;
  document.getElementById('dp_content').innerHTML = `
    <div class="detail-section">Business Info</div>
    <div class="detail-row"><div class="detail-label">Owner</div><div class="detail-val">${t.owner_name||'—'}</div></div>
    <div class="detail-row"><div class="detail-label">Email</div><div class="detail-val">${t.owner_email||'—'}</div></div>
    <div class="detail-row"><div class="detail-label">Phone</div><div class="detail-val">${t.phone||'—'}</div></div>
    <div class="detail-row"><div class="detail-label">Type</div><div class="detail-val">${t.business_type||'—'}</div></div>
    <div class="detail-row"><div class="detail-label">Cities</div><div class="detail-val">${t.service_cities||'—'}</div></div>
    <div class="detail-row"><div class="detail-label">Status</div><div class="detail-val">${t.status||'active'}</div></div>
    <div class="detail-row"><div class="detail-label">Joined</div><div class="detail-val">${new Date(t.created_at).toLocaleString()}</div></div>
    <div class="detail-section">Referral</div>
    <div class="detail-row"><div class="detail-label">Name</div><div class="detail-val">${t.referral_name||'—'}</div></div>
    <div class="detail-row"><div class="detail-label">Email</div><div class="detail-val">${t.referral_email||'—'}</div></div>
    <div class="detail-section">Keys & IDs</div>
    <div class="detail-row"><div class="detail-label">Tenant ID</div><div class="detail-val">${t.id}</div></div>
    <div class="detail-row"><div class="detail-label">Secret Key</div><div class="detail-val">${t.secret_key||'—'}</div></div>
    <div class="detail-section">API Connections</div>
    <div class="detail-row"><div class="detail-label">Vapi</div><div class="detail-val">${t.vapi_assistant_id||'Not set'}</div></div>
    <div class="detail-row"><div class="detail-label">Gemini</div><div class="detail-val">${t.gemini_api_key?'✅ Connected':'❌ Not set'}</div></div>
    <div class="detail-row"><div class="detail-label">Brevo</div><div class="detail-val">${t.brevo_smtp_key?'✅ Connected':'❌ Not set'}</div></div>
    <div class="detail-row"><div class="detail-label">WhatsApp</div><div class="detail-val">${t.whatsapp_apikey?'✅ Connected':'❌ Not set'}</div></div>
  `;
  document.getElementById('detailPanel').classList.add('open');
}
function closeDetail() { document.getElementById('detailPanel').classList.remove('open'); }

function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

document.getElementById('adminPass').addEventListener('keydown',e=>{ if(e.key==='Enter') adminLogin(); });
document.getElementById('addModal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeAddModal(); });
if (localStorage.getItem('cf_admin')) loadTenants();
</script>
</body>
</html>
