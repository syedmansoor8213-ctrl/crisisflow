<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Outside Service Area</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f8f8f8; font-family: system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .box { max-width: 440px; text-align: center; }
  .icon { font-size: 48px; margin-bottom: 20px; }
  h2 { font-size: 24px; margin-bottom: 12px; color: #111; }
  p { color: #666; line-height: 1.7; font-size: 15px; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">📍</div>
  <h2>We don't serve your area yet</h2>
  <p>Unfortunately we're not able to help with your request right now. We recommend searching Google for local services in your area. We're sorry we couldn't help!</p>
</div>
</body>
</html>
